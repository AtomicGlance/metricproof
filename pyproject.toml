[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metricproof"
version = "0.2.0"
description = "Executable checks for trustworthy business metrics, cohorts, denominators, and analytical populations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "AtomicGlance" }
]
keywords = [
  "analytics",
  "data-quality",
  "metrics",
  "cohort-analysis",
  "retention",
  "reconciliation"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4.23", "ruff>=0.12"]

[project.scripts]
metricproof = "metricproof.cli:main"

[project.urls]
Repository = "https://github.com/AtomicGlance/metricproof"
Issues = "https://github.com/AtomicGlance/metricproof/issues"
PyPI = "https://pypi.org/project/metricproof/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metricproof = ["py.typed", "schemas/*.json"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
